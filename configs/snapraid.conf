# ==============================================================================
# Configuration SnapRAID pour Proxmox VE 8 / Debian 12
# Emplacement : /etc/snapraid.conf
# ==============================================================================

# Disque de parité (doit être >= à la plus grande taille de disque de données)
parity /mnt/parity1/snapraid.parity

# Fichiers de contenu (Content Files)
# Règle : 1 fichier sur le disque système + 1 sur chaque disque de données
content /var/snapraid.content
content /mnt/disk1/.snapraid.content
content /mnt/disk2/.snapraid.content

# Disques de données
data d1 /mnt/disk1/
data d2 /mnt/disk2/

# Exclusions recommandées
exclude *.unrecoverable
exclude /tmp/
exclude /lost+found/
exclude .snapshots/
exclude *.bak
exclude *.tmp
exclude .DS_Store
exclude Thumbs.db
exclude .Trash-*/
