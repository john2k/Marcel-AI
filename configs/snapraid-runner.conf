[snapraid]
; Chemin vers le binaire snapraid
executable = /usr/bin/snapraid
; Chemin vers le fichier de configuration
config = /etc/snapraid.conf
; Seuil maximal de fichiers supprimés avant interruption de sécurité du sync
deletethreshold = 100
; Toujours exécuter touch avant sync
touch = true

[logging]
file = /var/log/snapraid-runner.log
maxsize = 5000

[email]
; Configurer si notification SMTP souhaitée
enabled = false
host = smtp.example.com
port = 587
user = user@example.com
password = password
ssl = false
tls = true
from = snapraid@example.com
to = admin@example.com
subject = [SnapRAID] Rapport d'exécution du job sur Proxmox
error_subject = [SnapRAID] ERREUR d'exécution du job sur Proxmox

[scrub]
; Activer ou désactiver le scrub automatique
enabled = true
; Pourcentage de la baie vérifié à chaque exécution
percentage = 5
; Âge minimal des blocs avant scrub (en jours)
older-than = 10
